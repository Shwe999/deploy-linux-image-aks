name: Build and Push Linux Image

on:
  push:
    branches: [ "main" ]

jobs:
  build-linux:
    runs-on: ubuntu-latest # This is a Linux VM provided by GitHub
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Linux Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile # References your Linux Dockerfile verbatim
          push: true
          tags: ${{ secrets.ACR_LOGIN_SERVER }}/linux-app:latest
